name: Terraform Destroy - Infrastructure
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para destruir"
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_myip: ${{ secrets.MY_IP_CIDR }}
  #AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  destroy:
    name: "Destroy Infrastructure"
    runs-on: ubuntu-latest
    environment: ${{ (github.event.inputs.environment == 'prod' || github.ref_name == 'production') && 'production' || 'development' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set environment directory
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" == "prod" ] || [ "${{ github.ref_name }}" == "production" ]; then
            echo "dir=environments/prod" >> $GITHUB_OUTPUT
          else
            echo "dir=environments/dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: terraform -chdir=${{ steps.env.outputs.dir }} init

      - name: Show Destroy plan
        run: terraform -chdir=${{ steps.env.outputs.dir }} plan -destroy
        continue-on-error: true

      - name: Destroy resources jobs
        id: destroy
        run: terraform -chdir=${{ steps.env.outputs.dir }} destroy --auto-approve
