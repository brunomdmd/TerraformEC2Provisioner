name: Deploy Infrastructure
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - ".github/**"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_myip: ${{ secrets.MY_IP_CIDR }}
  #AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  Checkov:
    name: "Check TF Vuls"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          checkov_args: --hard-fail-on HIGH,CRITICAL

  Apply:
    name: "Apply Changes"
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    needs: Checkov

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set environment directory
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "dir=environments/prod" >> $GITHUB_OUTPUT
          else
            echo "dir=environments/dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: terraform -chdir=${{ steps.env.outputs.dir }} init

      - name: Terraform Apply
        run: terraform -chdir=${{ steps.env.outputs.dir }} apply --auto-approve
